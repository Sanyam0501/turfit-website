<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Turf Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">🏟️ Turf Admin Panel</span>
        <a href="index.html" class="btn btn-outline-light btn-sm">Go to Site</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h4 class="mb-4">All Bookings</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    let supabaseAdmin = null;

    async function initAdmin() {
        const response = await fetch('/api/get-public-key');
        const keys = await response.json();
        supabaseAdmin = supabase.createClient(keys.SUPABASE_URL_PUBLIC, keys.SUPABASE_ANON_KEY);
        loadAllBookings();
    }

    async function loadAllBookings() {
        const { data, error } = await supabaseAdmin
            .from('turf_bookings')
            .select('*')
            .order('booking_date', { ascending: true });

        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';

        data.forEach(booking => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${booking.booking_date}</td>
                <td><span class="badge bg-info text-dark">${booking.time_slot}</span></td>
                <td>${booking.customer_name}</td>
                <td>${booking.phone_number}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteBooking('${booking.id}')">
                        🗑️ Delete
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function deleteBooking(id) {
        const result = await Swal.fire({
            title: 'Are you sure?',
            text: "This will cancel the user's booking!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'Yes, delete it!'
        });

        if (result.isConfirmed) {
            const res = await fetch(`/api/delete-booking?id=${id}`, { method: 'DELETE' });
            if (res.ok) {
                Swal.fire('Deleted!', 'Booking has been removed.', 'success');
                loadAllBookings();
            } else {
                Swal.fire('Error', 'Could not delete booking.', 'error');
            }
        }
    }

    initAdmin();
</script>
</body>
</html>
