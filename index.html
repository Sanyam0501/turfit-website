<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turf Booking Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #2d6a4f; --secondary: #40916c; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .turf-header { background: var(--primary); color: white; padding: 2rem 0; text-align: center; margin-bottom: 2rem; }
        .slot-card { cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .slot-card:hover:not(.booked) { border-color: var(--secondary); transform: translateY(-3px); }
        .booked { background-color: #dee2e6 !important; color: #6c757d; cursor: not-allowed; opacity: 0.6; }
        .selected { background-color: var(--secondary) !important; color: white !important; border-color: var(--primary); }
    </style>
</head>
<body>

<div class="turf-header">
    <h1>🏟️ Arena Turf Booking</h1>
    <p>Select your date and preferred time slot</p>
</div>

<div class="container mb-5">
    <div class="row">
        <div class="col-lg-4">
            <div class="card shadow-sm p-4 mb-4">
                <h5 class="mb-3">Booking Details</h5>
                <div class="mb-3">
                    <label class="form-label">Select Date</label>
                    <input type="date" id="bookingDate" class="form-control" onchange="fetchBookedSlots()">
                </div>
                <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text" id="custName" class="form-control" placeholder="John Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="custPhone" class="form-control" placeholder="9876543210">
                </div>
                <button class="btn btn-success w-100 py-2" onclick="confirmBooking()">Book Selected Slot</button>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm p-4">
                <h5 class="mb-4">Available Slots</h5>
                <div class="row g-3" id="slotsContainer">
                    </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // INITIALIZE SUPABASE
    // Replace these with your actual keys from Supabase Dashboard -> Settings -> API
    const SUPABASE_URL = "https://lwnghxofqcbahxplaitq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3bmdoeG9mcWNiYWh4cGxhaXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MjAwMzgsImV4cCI6MjA3OTk5NjAzOH0._ZoLSbagxvptaBOUnewyWmb18PSHNkLLXaUsJkbXjFY";
    const supabase = lib.createClient(SUPABASE_URL, SUPABASE_KEY);

    const SLOTS = [
        "06:00 AM - 07:00 AM", "07:00 AM - 08:00 AM", "08:00 AM - 09:00 AM",
        "04:00 PM - 05:00 PM", "05:00 PM - 06:00 PM", "06:00 PM - 07:00 PM",
        "07:00 PM - 08:00 PM", "08:00 PM - 09:00 PM", "09:00 PM - 10:00 PM"
    ];

    let selectedSlot = null;
    let bookedSlots = [];

    // Set default date to today
    document.getElementById('bookingDate').valueAsDate = new Date();

    async function fetchBookedSlots() {
        const date = document.getElementById('bookingDate').value;
        const { data, error } = await supabase
            .from('turf_bookings')
            .select('time_slot')
            .eq('booking_date', date);

        bookedSlots = data ? data.map(b => b.time_slot) : [];
        renderSlots();
    }

    function renderSlots() {
        const container = document.getElementById('slotsContainer');
        container.innerHTML = '';
        selectedSlot = null;

        SLOTS.forEach(slot => {
            const isBooked = bookedSlots.includes(slot);
            const div = document.createElement('div');
            div.className = `col-md-4 col-6`;
            div.innerHTML = `
                <div class="card p-3 text-center slot-card ${isBooked ? 'booked' : ''}" 
                     onclick="selectSlot(this, '${slot}', ${isBooked})">
                    ${slot}
                </div>
            `;
            container.appendChild(div);
        });
    }

    function selectSlot(element, slot, isBooked) {
        if (isBooked) return;
        
        document.querySelectorAll('.slot-card').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedSlot = slot;
    }

    async function confirmBooking() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const date = document.getElementById('bookingDate').value;

        if (!selectedSlot || !name || !phone) {
            Swal.fire('Error', 'Please fill all fields and select a slot', 'error');
            return;
        }

        const { error } = await supabase.from('turf_bookings').insert([{
            customer_name: name,
            phone_number: phone,
            booking_date: date,
            time_slot: selectedSlot
        }]);

        if (error) {
            Swal.fire('Already Booked', 'This slot was just taken. Please pick another.', 'error');
        } else {
            Swal.fire('Success!', 'Your turf is booked.', 'success');
            fetchBookedSlots();
        }
    }

    // Load initial slots
    fetchBookedSlots();
</script>
</body>
</html>
