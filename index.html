<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turf Booking Manager</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --turf-green: #1b4332; --action: #2d6a4f; }
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .hero { background: var(--turf-green); color: white; padding: 40px 0; margin-bottom: 30px; border-bottom: 4px solid #95d5b2; }
        .slot-card { cursor: pointer; border: 2px solid #eee; transition: 0.2s; background: #fff; }
        .slot-card:hover:not(.booked) { border-color: var(--action); transform: translateY(-2px); }
        .booked { background: #e9ecef!important; color: #adb5bd; cursor: not-allowed; border-style: dashed; }
        .selected { background: var(--action)!important; color: white!important; border-color: var(--turf-green); }
        .nav-pills .nav-link.active { background-color: var(--action); }
    </style>
</head>
<body>

<div class="hero text-center">
    <h1>🏟️ Turf Booking & Admin</h1>
    <p>Securely manage your slots and bookings</p>
</div>

<div class="container mt-4">
    <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-book">Book Slot</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-admin" onclick="loadAdminTable()">Admin View</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-book">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card p-4 border-0 shadow-sm">
                        <label class="form-label fw-bold">1. Select Date</label>
                        <input type="date" id="bookDate" class="form-control mb-3" onchange="fetchSlots()">
                        <label class="form-label fw-bold">2. Your Details</label>
                        <input type="text" id="userName" class="form-control mb-2" placeholder="Full Name">
                        <input type="tel" id="userPhone" class="form-control mb-3" placeholder="Phone Number">
                        <button class="btn btn-success w-100 py-2 fw-bold" onclick="handleBooking()">RESERVE SLOT</button>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card p-4 border-0 shadow-sm">
                        <h5 class="mb-3">Available Times</h5>
                        <div class="row g-2" id="slotGrid"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-admin">
            <div class="card p-4 border-0 shadow-sm">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="m-0">All Bookings</h5>
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadAdminTable()">Refresh</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    let supabaseClient = null;
    let selectedSlot = null;
    const SLOTS = ["06:00 AM", "08:00 AM", "10:00 AM", "04:00 PM", "06:00 PM", "08:00 PM", "10:00 PM"];

    async function initApp() {
        try {
            const res = await fetch('/api/get-public-key');
            const keys = await res.json();
            supabaseClient = supabase.createClient(keys.SUPABASE_URL_PUBLIC, keys.SUPABASE_ANON_KEY);
            document.getElementById('bookDate').valueAsDate = new Date();
            fetchSlots();
        } catch (e) {
            Swal.fire("Error", "Check your Vercel Environment Variables", "error");
        }
    }

    async function fetchSlots() {
        if (!supabaseClient) return;
        const date = document.getElementById('bookDate').value;
        const { data } = await supabaseClient.from('turf_bookings').select('time_slot').eq('booking_date', date);
        const taken = data ? data.map(b => b.time_slot) : [];
        
        const grid = document.getElementById('slotGrid');
        grid.innerHTML = '';
        selectedSlot = null;

        SLOTS.forEach(s => {
            const isTaken = taken.includes(s);
            const div = document.createElement('div');
            div.className = 'col-6 col-lg-4';
            div.innerHTML = `<div class="p-3 text-center rounded slot-card ${isTaken ? 'booked' : ''}" onclick="selectSlot(this, '${s}', ${isTaken})">
                <div class="fw-bold">${s}</div>
                <small>${isTaken ? 'Full' : 'Select'}</small>
            </div>`;
            grid.appendChild(div);
        });
    }

    function selectSlot(el, slot, isTaken) {
        if (isTaken) return;
        document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        selectedSlot = slot;
    }

    async function handleBooking() {
        const name = document.getElementById('userName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        const date = document.getElementById('bookDate').value;

        if (!selectedSlot || !name || !phone) return Swal.fire("Required", "Complete all info", "warning");

        const { error } = await supabaseClient.from('turf_bookings').insert([{
            customer_name: name, phone_number: phone, booking_date: date, time_slot: selectedSlot
        }]);

        if (error) Swal.fire("Error", "Slot taken or database error", "error");
        else {
            Swal.fire("Success", "Turf Booked!", "success");
            fetchSlots();
        }
    }

    async function loadAdminTable() {
        if (!supabaseClient) return;
        const { data } = await supabaseClient.from('turf_bookings').select('*').order('booking_date', {ascending: false});
        const body = document.getElementById('adminBody');
        body.innerHTML = '';
        data.forEach(b => {
            body.innerHTML += `<tr>
                <td>${b.booking_date}</td>
                <td><span class="badge bg-success">${b.time_slot}</span></td>
                <td>${b.customer_name}</td>
                <td>${b.phone_number}</td>
                <td><button class="btn btn-danger btn-sm" onclick="doDelete('${b.id}')"><i class="bi bi-trash"></i></button></td>
            </tr>`;
        });
    }

    async function doDelete(id) {
        const confirm = await Swal.fire({ title: 'Delete?', icon: 'warning', showCancelButton: true });
        if (confirm.isConfirmed) {
            const res = await fetch(`/api/delete-booking?id=${id}`, { method: 'DELETE' });
            if (res.ok) {
                Swal.fire("Deleted", "", "success");
                loadAdminTable();
                fetchSlots();
            } else {
                Swal.fire("Error", "Check Vercel Logs", "error");
            }
        }
    }

    initApp();
</script>
</body>
</html>
