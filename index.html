<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURFIT - Custom Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --turf-green: #1b4332; --action: #2d6a4f; }
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .hero { background: var(--turf-green); color: #fff; padding: 40px 0; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,.05); }
        .booking-row { border-left: 5px solid var(--action); margin-bottom: 10px; padding: 15px; background: white; border-radius: 8px; }
    </style>
</head>
<body>

<div class="hero text-center mb-5">
    <h1 class="fw-bold">TURFIT BOOKINGS</h1>
    <!-- <p class="opacity-75">Book any time, any duration</p> -->
</div>

<div class="container">
    <ul class="nav nav-pills mb-4 justify-content-center bg-white p-2 rounded-pill shadow-sm mx-auto" style="max-width:350px">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-book">New Booking</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-admin" onclick="loadBookings()">All Bookings</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-book">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card p-4">
                        <h5 class="fw-bold text-success mb-4 text-center">Reserve the Turf</h5>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Date</label>
                            <input type="date" id="bookDate" class="form-control" onchange="loadBookingsForDay()">
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Start Time</label>
                                <input type="time" id="startTime" class="form-control">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Duration (Hours)</label>
                                <select id="duration" class="form-select">
                                    <option value="1">1 Hour</option>
                                    <option value="1.5">1.5 Hours</option>
                                    <option value="2">2 Hours</option>
                                    <option value="2.5">2.5 Hours</option>
                                    <option value="3">3 Hours</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Customer Name</label>
                            <input type="text" id="userName" class="form-control" placeholder="Enter name">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Phone</label>
                            <input type="tel" id="userPhone" class="form-control" placeholder="Enter phone">
                        </div>

                        <button class="btn btn-success w-100 py-3 fw-bold" onclick="handleBooking()">RESERVE NOW</button>
                    </div>
                </div>

                <div class="col-md-5 mt-4 mt-md-0">
                    <div class="card p-4">
                        <h6 class="fw-bold mb-3 text-muted">Booked for selected day:</h6>
                        <div id="dayList" class="small text-muted text-center">Select a date to see existing bookings</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-admin">
            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Time Range</th>
                                <th>Customer</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    let supabaseClient;

    async function initApp() {
        const res = await fetch('/api/get-public-key');
        const keys = await res.json();
        supabaseClient = supabase.createClient(keys.SUPABASE_URL_PUBLIC, keys.SUPABASE_ANON_KEY);
        
        const d = new Date();
        document.getElementById('bookDate').valueAsDate = d;
        loadBookingsForDay();
    }

    // Helper to calculate End Time
    function calculateEndTime(startTime, durationHours) {
        let [hours, minutes] = startTime.split(':').map(Number);
        let totalMinutes = hours * 60 + minutes + (durationHours * 60);
        let endH = Math.floor(totalMinutes / 60) % 24;
        let endM = totalMinutes % 60;
        return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}:00`;
    }

    async function handleBooking() {
        const name = document.getElementById('userName').value;
        const phone = document.getElementById('userPhone').value;
        const date = document.getElementById('bookDate').value;
        const start = document.getElementById('startTime').value;
        const duration = parseFloat(document.getElementById('duration').value);

        if (!name || !phone || !date || !start) return Swal.fire("Required", "All fields are mandatory", "warning");

        const end = calculateEndTime(start, duration);

        // --- OVERLAP CHECK ---
        // Checks if (NewStart < ExistingEnd) AND (NewEnd > ExistingStart)
        const { data: overlaps } = await supabaseClient
            .from('turf_bookings')
            .select('*')
            .eq('booking_date', date)
            .lt('start_time', end)
            .gt('end_time', start + ":00");

        if (overlaps && overlaps.length > 0) {
            return Swal.fire("Unavailable", "This time overlaps with an existing booking!", "error");
        }

        const { error } = await supabaseClient.from('turf_bookings').insert([{
            customer_name: name,
            phone_number: phone,
            booking_date: date,
            start_time: start + ":00",
            end_time: end
        }]);

        if (error) {
            Swal.fire("Error", error.message, "error");
        } else {
            Swal.fire("Success", "Booking confirmed!", "success");
            loadBookingsForDay();
        }
    }

    async function loadBookingsForDay() {
        const date = document.getElementById('bookDate').value;
        const { data } = await supabaseClient
            .from('turf_bookings')
            .select('start_time, end_time, customer_name')
            .eq('booking_date', date)
            .order('start_time');

        const container = document.getElementById('dayList');
        container.innerHTML = '';

        if (data && data.length > 0) {
            data.forEach(b => {
                container.innerHTML += `
                    <div class="alert alert-success py-2 mb-2 text-start">
                        <strong>${b.start_time.slice(0,5)} - ${b.end_time.slice(0,5)}</strong><br>
                        <span class="small">${b.customer_name}</span>
                    </div>`;
            });
        } else {
            container.innerHTML = "No bookings for this date.";
        }
    }

    async function loadBookings() {
        const { data } = await supabaseClient.from('turf_bookings')
            .select('*')
            .order('booking_date', { ascending: false })
            .order('start_time', { ascending: true });

        const body = document.getElementById('adminBody');
        body.innerHTML = '';
        data.forEach(b => {
            body.innerHTML += `
                <tr>
                    <td>${b.booking_date}</td>
                    <td><span class="badge bg-success">${b.start_time.slice(0,5)} to ${b.end_time.slice(0,5)}</span></td>
                    <td>${b.customer_name}</td>
                    <td class="text-center">
                        <button class="btn btn-outline-danger btn-sm" onclick="doDelete('${b.id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>`;
        });
    }

    async function doDelete(id) {
        const res = await Swal.fire({ title: 'Delete?', showCancelButton: true });
        if (!res.isConfirmed) return;
        await supabaseClient.from('turf_bookings').delete().eq('id', id);
        loadBookings();
        loadBookingsForDay();
    }

    initApp();
</script>
</body>
</html>
