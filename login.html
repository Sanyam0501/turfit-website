<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-60LW846W7X"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TURFIT Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      body {
        background: #1b4332;
        color: white;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      .pin-input {
        width: 220px;
        text-align: center;
        font-size: 2.5rem;
        letter-spacing: 8px;
        background: transparent;
        border: none;
        border-bottom: 2px solid white;
        color: white;
        outline: none;
      }

      /* SweetAlert custom class to prevent background shift */
      body.swal2-shown:not(.swal2-no-backdrop):not(.swal2-toast-shown) {
        overflow-y: auto !important;
      }
    </style>
  </head>

  <body>
    <div class="text-center">
      <i class="bi bi-shield-lock-fill mb-3" style="font-size: 3rem"></i>
      <h4 class="fw-bold mb-4">TURFIT ACCESS</h4>
      <input
        type="password"
        id="pinEntry"
        class="pin-input"
        maxlength="6"
        placeholder="••••••"
      />
      <p class="mt-3 opacity-75 small">Enter Security PIN</p>
      <p
        id="attemptsMessage"
        class="small text-danger mt-2"
        style="display: none; height: 20px"
      ></p>
      <button
        id="loginBtn"
        class="btn btn-outline-light mt-2 px-4 rounded-pill"
      >
        LOGIN
      </button>
      <p
        id="lockTimer"
        class="text-warning mt-2 fw-bold"
        style="display: none"
      ></p>
    </div>

    <script>
      // Always clear old session on login page
      sessionStorage.removeItem("turf_session");

      async function initLogin() {
        let countdown;

        function startLockTimer(seconds) {
          const timer = document.getElementById("lockTimer");
          const pinInput = document.getElementById("pinEntry");
          const loginBtn = document.getElementById("loginBtn");

          clearInterval(countdown);

          timer.style.display = "block";
          pinInput.disabled = true;
          loginBtn.disabled = true;

          countdown = setInterval(() => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;

            timer.innerText = `Try again in ${mins}:${secs.toString().padStart(2, "0")}`;

            if (seconds <= 0) {
              clearInterval(countdown);
              timer.style.display = "none";
              pinInput.disabled = false;
              loginBtn.disabled = false;
            }
            seconds--;
          }, 1000);
        }
        try {
          document
            .getElementById("pinEntry")
            .addEventListener("input", checkPin);

          document
            .getElementById("loginBtn")
            .addEventListener("click", checkPin);
        } catch (err) {
          Swal.fire("Error", "Unable to initialize login", "error");
        }
      }

      async function checkPin(e) {
        const pin = document.getElementById("pinEntry").value.trim();
        const attemptsMessageEl = document.getElementById("attemptsMessage");

        // Hide any previous messages on new input
        attemptsMessageEl.style.display = "none";

        // Only run the database check when exactly 4 digits are entered
        if (e && e.type === "input" && pin.length !== 4) return;
        if (!pin) return;

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin }),
          });

          const data = await res.json();

          if (res.ok && data.token) {
            sessionStorage.setItem("turf_session", data.token);
            window.location.href = "admin.html";
          } else {
            document.getElementById("pinEntry").value = "";
            let errorMessage = data.error || "Invalid PIN";

            // Handle lockout message
            if (res.status === 429) {
              const error = new Error(errorMessage);
              if (data.retryAfter) {
                error.retryAfter = data.retryAfter;
              }
              throw error;
            }

            // If there are attempts remaining, append that info to the error message
            if (
              data.attemptsRemaining !== undefined &&
              data.attemptsRemaining > 0
            ) {
              errorMessage = `Invalid PIN. ${data.attemptsRemaining} ${data.attemptsRemaining === 1 ? 'try' : 'tries'} remaining.`;
            }

            throw new Error(errorMessage);
          }
        } catch (err) {
          const input = document.getElementById("pinEntry");
          input.blur(); // Remove focus so Safari doesn't move the page

          Swal.fire({
            title: "Access Denied",
            text: err.message,
            icon: "error",
            confirmButtonText: "OK"
          }).then(() => {
            if (err.retryAfter) {
              startLockTimer(err.retryAfter);
            }
          }).then(() => {
            input.focus(); // Optional: focus again after closing
          });
        }
      }

      initLogin();
    </script>

    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
