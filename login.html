<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURFIT Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: #1b4332;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .pin-input {
            width: 220px;
            text-align: center;
            font-size: 2.5rem;
            letter-spacing: 8px;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            color: white;
            outline: none;
        }
    </style>
</head>

<body>

<div class="text-center">
    <i class="bi bi-shield-lock-fill mb-3" style="font-size:3rem;"></i>
    <h4 class="fw-bold mb-4">TURFIT ACCESS</h4>
    <input type="password" id="pinEntry" class="pin-input" maxlength="6" autofocus placeholder="••••••">
    <p class="mt-3 opacity-75 small">Enter Security PIN</p>
</div>

<script>
    let supabaseClient;

    // Always clear old session on login page
    sessionStorage.removeItem('turf_session');

    async function initLogin() {
        try {
            const res = await fetch('/api/get-public-key');
            if (!res.ok) throw new Error("Config load failed");

            const keys = await res.json();
            supabaseClient = supabase.createClient(
                keys.SUPABASE_URL_PUBLIC,
                keys.SUPABASE_ANON_KEY
            );

            document
                .getElementById('pinEntry')
                .addEventListener('input', checkPin);

        } catch (err) {
            Swal.fire("Error", "Unable to initialize login", "error");
        }
    }

    async function checkPin() {
    const pin = document.getElementById('pinEntry').value.trim();

    // Trigger ONLY when the length reaches 4 (for PIN 0708)
    if (pin.length !== 4) return; 

    const { data, error } = await supabaseClient
        .from('site_access')
        .select('pin')
        .eq('id', 1)
        .single();

    if (error || !data) {
        console.error("Supabase Error:", error);
        Swal.fire("Error", "Unable to verify PIN", "error");
        return;
    }

    // Ensure we are comparing strings and trimming whitespace
    const dbPin = String(data.pin).trim();

    if (dbPin === pin) {
        sessionStorage.setItem('turf_session', 'active');
        window.location.href = 'admin.html';
    } else {
        // Use a small delay so the user sees the 4th dot before clearing
        setTimeout(() => {
            Swal.fire("Invalid PIN", "Access Denied", "error");
            document.getElementById('pinEntry').value = '';
        }, 100);
    }
}

    initLogin();
</script>

</body>
</html>
