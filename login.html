<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURFIT Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: #1b4332;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .pin-input {
            width: 220px;
            text-align: center;
            font-size: 2.5rem;
            letter-spacing: 8px;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            color: white;
            outline: none;
        }
    </style>
</head>

<body>

    <div class="text-center">
        <i class="bi bi-shield-lock-fill mb-3" style="font-size:3rem;"></i>
        <h4 class="fw-bold mb-4">TURFIT ACCESS</h4>
        <input type="password" id="pinEntry" class="pin-input" maxlength="6" autofocus placeholder="••••••">
        <p class="mt-3 opacity-75 small">Enter Security PIN</p>
    </div>

    <script>
        let supabaseClient;

        async function initLogin() {
            const res = await fetch('/api/get-public-key');
            const keys = await res.json();
            supabaseClient = supabase.createClient(
                keys.SUPABASE_URL_PUBLIC,
                keys.SUPABASE_ANON_KEY
            );

            document.getElementById('pinEntry')
                .addEventListener('input', checkPin);
        }

        async function checkPin() {
            const pin = document.getElementById('pinEntry').value;
            if (pin.length < 4) return;

            const { data, error } = await supabaseClient
                .from('site_access')
                .select('pin')
                .eq('id', 1)
                .single();

            if (error) {
                Swal.fire("Error", "Unable to verify PIN", "error");
                return;
            }

            if (data.pin === pin) {
                sessionStorage.setItem('turf_session', 'active');
                window.location.href = 'admin.html';
            } else {
                Swal.fire("Invalid PIN", "Access Denied", "error");
                document.getElementById('pinEntry').value = '';
            }
        }

        initLogin();
    </script>

</body>

</html>
